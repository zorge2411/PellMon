[plugin_Backup]

# Backup plugin configuration file
#
# The plugin is turned on and configured on the Backup page of the web interface
# (schedule, sub-folder, how many backups to keep). This file only names the folder
# the backups are written to, as the daemon sees it INSIDE the container. docker-compose.yml
# mounts the host folder ${PELLMON_BACKUP_DIR} there, so normally nothing needs to change.
#folder = /backups
