name: CI

on:
  push:
    branches:
      - master
      - python3-migration
  pull_request:
    branches:
      - master
      - python3-migration

jobs:
  test:
    name: Run Python Tests and Import Verification
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: /usr/lib/python3/dist-packages:src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-dbus python3-gi python3-gi-cairo gir1.2-glib-2.0 \
            librrd-dev rrdtool python3-rrdtool

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock pytest-socket

      - name: Run import tests
        run: |
          python test-imports.py

      - name: Run test suite
        run: |
          pytest tests/ -v
