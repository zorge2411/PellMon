name: CI

on:
  push:
    branches:
      - master
      - python3-migration
  pull_request:
    branches:
      - master
      - python3-migration

jobs:
  test:
    name: Run Python Tests and Import Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-dbus python3-gi python3-gi-cairo gir1.2-glib-2.0 \
            librrd-dev rrdtool python3-rrdtool python3-venv

      # Uses the runner's system python3 so apt-installed dbus/gi/rrdtool are importable.
      # pip is deliberately NOT self-upgraded: that triggered
      # "Cannot uninstall pip 24.0 ... installed by debian".
      - name: Create virtualenv with system site packages
        run: |
          python3 -m venv --system-site-packages "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: |
          python -c "import sys; print(sys.executable)"
          pip --version
          pip install -r requirements.txt
          pip install pytest pytest-mock pytest-socket

      - name: Verify system bindings are visible in the venv
        run: |
          python -c "import dbus, gi, rrdtool; print('system bindings OK')"

      - name: Run import tests
        env:
          PYTHONPATH: src
        run: |
          python test-imports.py

      - name: Run test suite
        env:
          PYTHONPATH: src
        run: |
          pytest tests/ -v

  publish:
    name: Bump version and publish Docker image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Full history is required because `git describe --tags` and
      # `git log {tag}..HEAD` are unreliable on the default shallow clone.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide version bump
        id: bump
        run: |
          python3 tools/version_bump.py decide

      - name: Commit and tag version bump
        if: steps.bump.outputs.bump != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git tag -a "v${{ steps.bump.outputs.version }}" -m "Release ${{ steps.bump.outputs.version }}"
          git push origin HEAD:master
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Set up QEMU
        if: steps.bump.outputs.bump != 'none'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.bump.outputs.bump != 'none'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.bump.outputs.bump != 'none'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Note: buildx pushes all `tags:` as one atomic multi-platform manifest
      # operation. The reference publish.ps1 pushed :latest and :{version} as
      # two independent `docker push` calls, failing fast before attempting
      # the second; that per-tag failure isolation does not exist here. This
      # is an intentional, accepted deviation (D-02 structurally forces it).
      - name: Build and push
        if: steps.bump.outputs.bump != 'none'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            peterscholer74/pellmon:latest
            peterscholer74/pellmon:${{ steps.bump.outputs.version }}
