# PellMon Docker Compose Configuration
#
# Usage:
#   docker compose build            # Build image first
#   docker compose up -d            # Start all services
#   docker compose logs -f          # Follow logs
#   docker compose down             # Stop all services

services:
  # ===========================================
  # One-shot init: create the host data folders and give them to the
  # non-root pellmon user (uid/gid 999) before the daemon starts
  # ===========================================
  pellmon-init:
    # Deliberately no image build here: pellmonsrv is the only service that builds
    # pellmon:latest (two parallel builders race to tag the same image name).
    image: pellmon:latest
    pull_policy: never
    container_name: pellmon-init
    user: root
    restart: "no"
    command: >
      sh -c "mkdir -p /var/lib/pellmon /var/log/pellmon &&
             chown -R 999:999 /var/lib/pellmon /var/log/pellmon &&
             chmod 755 /var/lib/pellmon /var/log/pellmon"
    volumes:
      - ${PELLMON_DATA_DIR:-./pellmon-data}/data:/var/lib/pellmon
      - ${PELLMON_DATA_DIR:-./pellmon-data}/logs:/var/log/pellmon
    networks:
      - pellmon-network

  # ===========================================
  # Shared D-Bus session bus daemon
  #
  # Deliberately its own service, independent of pellmonsrv and pellmonweb's
  # container lifecycles. If the bus daemon lived inside pellmonsrv's command
  # (as it did previously), stopping/restarting pellmonsrv would kill and
  # recreate the bus itself -- pellmonweb only ever opens ONE D-Bus connection
  # for its whole process lifetime (see Dbus_handler.start() in pellmonweb.py)
  # and relies on watch_name_owner to notice org.pellmon.int coming and going
  # on a STABLE bus. A brand-new bus daemon process breaks that connection
  # permanently, with no recovery short of restarting pellmonweb itself. Keeping
  # the bus daemon alive across pellmonsrv restarts is what makes pellmonweb's
  # existing reconnect logic actually work.
  # ===========================================
  pellmon-dbus:
    image: pellmon:latest
    pull_policy: never
    container_name: pellmon-dbus
    restart: unless-stopped
    user: pellmon

    depends_on:
      pellmon-init:
        condition: service_completed_successfully

    volumes:
      # Shared socket location (using the pellmon run directory)
      - pellmon-run:/var/run/pellmon

    # Run dbus-daemon in the foreground (no --fork) so it stays PID 1 and
    # compose/Docker can supervise and restart it independently.
    command: >
      sh -c "rm -f /var/run/pellmon/bus_socket &&
             exec dbus-daemon --session --address=unix:path=/var/run/pellmon/bus_socket --nofork"

    networks:
      - pellmon-network

    healthcheck:
      test: [ "CMD-SHELL", "dbus-send --bus=unix:path=/var/run/pellmon/bus_socket --print-reply --dest=org.freedesktop.DBus / org.freedesktop.DBus.ListNames > /dev/null 2>&1 || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===========================================
  # PellMon Server (pellmonsrv)
  # Main service that communicates with pellet burner
  # ===========================================
  pellmonsrv:
    build:
      context: .
      dockerfile: Dockerfile
    image: pellmon:latest
    container_name: pellmonsrv
    restart: unless-stopped

    # Required for serial port access
    privileged: true

    # The container runs as the non-root "pellmon" user, so it needs the group that owns the
    # serial device. Find it with:  stat -c %g /dev/ttyUSB0   (20 = dialout on Debian/Raspberry Pi OS)
    # and set SERIAL_GID in .env. Without it the serial port cannot be opened.
    group_add:
      - "${SERIAL_GID:-20}"

    depends_on:
      pellmon-init:
        condition: service_completed_successfully
      pellmon-dbus:
        condition: service_healthy

    environment:
      - TZ=${TZ:-Europe/Stockholm}
      # Non-root user has no home dir: give Fontconfig (used by rrdtool graph) a writable cache
      - XDG_CACHE_HOME=/tmp
      # Exit loudly instead of falling back to /tmp when the data folder is unusable (D-07)
      - PELLMON_REQUIRE_DATADIR=1
      # Use a shared session bus socket -- owned by the pellmon-dbus service now,
      # not started by this container, so restarting pellmonsrv never touches the bus.
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/var/run/pellmon/bus_socket

    volumes:
      # Configuration file
      - ./config/pellmon.conf:/etc/pellmon/pellmon.conf:ro
      - ./config/conf.d:/etc/pellmon/conf.d:ro

      # Data persistence (RRD database) on the host
      - ${PELLMON_DATA_DIR:-./pellmon-data}/data:/var/lib/pellmon

      # Logs
      - ${PELLMON_DATA_DIR:-./pellmon-data}/logs:/var/log/pellmon

      # Shared socket location (using the pellmon run directory)
      - pellmon-run:/var/run/pellmon

      # Serial device access (adjust as needed)
      - /dev:/dev:ro

    command: >
      python3 -m Pellmonsrv.pellmonsrv -C /etc/pellmon/pellmon.conf -D SESSION debug

    networks:
      - pellmon-network

    healthcheck:
      test: [ "CMD-SHELL", "dbus-send --bus=unix:path=/var/run/pellmon/bus_socket --dest=org.pellmon.int --print-reply /org/pellmon/int org.freedesktop.DBus.Peer.Ping > /dev/null 2>&1 || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  # ===========================================
  # PellMon Web Interface (pellmonweb)
  # Web dashboard for monitoring and control
  # ===========================================
  pellmonweb:
    # Use the same image built by pellmonsrv (no separate build)
    image: pellmon:latest
    container_name: pellmonweb
    restart: unless-stopped

    depends_on:
      pellmonsrv:
        condition: service_healthy

    environment:
      - TZ=${TZ:-Europe/Stockholm}
      # Non-root user has no home dir: give Fontconfig (used by rrdtool graph) a writable cache
      - XDG_CACHE_HOME=/tmp
      # Bind all interfaces inside the container (needed for port publishing)
      - PELLMON_WEB_HOST=${PELLMON_WEB_HOST:-0.0.0.0}
      # Connect to the same shared socket
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/var/run/pellmon/bus_socket

    ports:
      # Web interface
      - "${PELLMON_WEB_PORT:-8081}:8081"
      # WebSocket (optional)
      - "${PELLMON_WS_PORT:-8082}:8082"

    volumes:
      # Configuration
      - ./config/pellmon.conf:/etc/pellmon/pellmon.conf:ro
      # Writable per D-08, but the container user is uid 999: files owned by the host user are
      # NOT writable from inside the container unless you make them so. pellmon-init does not
      # chown this folder (you edit it on the host), and no writer runs in this stack today.
      - ./config/conf.d:/etc/pellmon/conf.d

      # Shared data with server (read-only)
      - ${PELLMON_DATA_DIR:-./pellmon-data}/data:/var/lib/pellmon:ro

      # Logs
      - ${PELLMON_DATA_DIR:-./pellmon-data}/logs:/var/log/pellmon

      # Shared socket location
      - pellmon-run:/var/run/pellmon

    # Use python3 for system Python
    # Connect to SESSION bus (default)
    command: [ "python3", "-m", "Pellmonweb.pellmonweb", "-C", "/etc/pellmon/pellmon.conf", "-d", "SESSION" ]

    networks:
      - pellmon-network

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s

# ===========================================
# Only the D-Bus socket is a named volume; data and logs are host bind mounts
# ===========================================
volumes:
  pellmon-run:
    driver: local

# ===========================================
# Network configuration
# ===========================================
networks:
  pellmon-network:
    driver: bridge
