# PellMon dashboard for Home Assistant (Sections view).
# Generated by tools/ha_dashboard.py --silo-capacity 220
# Paste into: Dashboards > (your dashboard) > pencil > three dots > Raw configuration editor.
# Re-generate after the entity list changes instead of editing by hand.
title: PellMon
views:
  - title: Pellets
    path: pellmon
    icon: mdi:fire
    type: sections
    max_columns: 3
    header:
      layout: responsive
      badges_position: bottom
      card:
        type: markdown
        text_only: true
        content: "# PellMon"
    badges:
      - type: entity
        entity: sensor.burner_mode
        show_name: false
      - type: entity
        entity: sensor.boiler_temperature
        show_name: false
      - type: entity
        entity: sensor.silo_days_left
        show_name: false
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Burner now
            heading_style: title
            icon: mdi:fire
            badges:
              - type: entity
                entity: sensor.power
                show_state: true
                show_icon: true
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.alarm
                state_not: ok
            card:
              type: tile
              entity: sensor.alarm
              name: Alarm
              color: red
              icon: mdi:alert
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.burner_mode
                name: Mode
                icon: mdi:fire
              - type: tile
                entity: sensor.alarm
                name: Alarm
                icon: mdi:shield-check
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.power
                name: Power
                features:
                  - type: bar-gauge
                    min: 0
                    max: 100
              - type: tile
                entity: sensor.power_kw
                name: Power kW
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.boiler_temperature
                name: Boiler
                features:
                  - type: trend-graph
                    hours_to_show: 24
                    detail: true
              - type: tile
                entity: sensor.smoke_temperature
                name: Smoke
                features:
                  - type: trend-graph
                    hours_to_show: 24
                    detail: true
              - type: tile
                entity: sensor.chute_temperature
                name: Chute
              - type: tile
                entity: sensor.oxygen_level
                name: Oxygen
              - type: tile
                entity: sensor.desired_oxygen_level
                name: Oxygen target
              - type: tile
                entity: sensor.light_ldr
                name: Light sensor
      - type: grid
        cards:
          - type: heading
            heading: Fuel
            heading_style: title
            icon: mdi:grain
            badges:
              - type: entity
                entity: sensor.silo_level
                show_state: true
                show_icon: true
          - type: gauge
            entity: sensor.silo_days_left
            name: Silo days left
            min: 0
            max: 60
            needle: true
            segments:
              - from: 0
                color: "#db4437"
              - from: 7
                color: "#ffa600"
              - from: 21
                color: "#43a047"
          - type: tile
            entity: sensor.silo_empty_date
            name: Empty around
            icon: mdi:calendar-end
          - type: tile
            entity: sensor.silo_level
            name: Silo level
            features:
              - type: bar-gauge
                min: 0
                max: 220
            icon: mdi:grain
          - type: grid
            columns: 3
            square: false
            cards:
              - type: tile
                entity: sensor.consumption_today
                name: Today
                vertical: true
              - type: tile
                entity: sensor.consumption_7_days
                name: "7 days"
                vertical: true
              - type: tile
                entity: sensor.consumption_this_month
                name: This month
                vertical: true
          - type: tile
            entity: sensor.magazine_content
            name: Magazine
            icon: mdi:silo
      - type: grid
        cards:
          - type: heading
            heading: Heating & water
            heading_style: title
            icon: mdi:water-thermometer
            badges:
              - type: entity
                entity: sensor.hot_water_temperature
                show_state: true
                show_icon: true
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.boiler_return_temperature
                name: Boiler return
              - type: tile
                entity: sensor.hot_water_temperature
                name: Hot water
          - type: history-graph
            title: Temperatures
            hours_to_show: 24
            entities:
              - entity: sensor.boiler_temperature
                name: Boiler
              - entity: sensor.boiler_return_temperature
                name: Boiler return
              - entity: sensor.hot_water_temperature
                name: Hot water
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Silo history and forecast
            heading_style: title
            icon: mdi:chart-areaspline
          - type: custom:apexcharts-card
            section_mode: true
            grid_options:
              columns: full
              rows: 6
            graph_span: "90d"
            span:
              start: day
              offset: "-21d"
            header:
              show: true
              title: Silo level and forecast
              show_states: true
              colorize_states: true
            now:
              show: true
              label: Now
            yaxis:
              - min: 0
                max: 220
                decimals: 0
            series:
              - entity: sensor.silo_level
                name: Level
                type: area
                color: "#c4571a"
                stroke_width: 2
                extend_to: now
                statistics:
                  type: mean
                  period: hour
              - entity: sensor.silo_level
                name: Forecast
                type: line
                color: "#c4571a"
                stroke_width: 2
                stroke_dash: 5
                show:
                  in_header: false
                  legend_value: false
                data_generator: |-
                  const days = parseFloat(hass.states['sensor.silo_days_left'].state);
                  const level = parseFloat(entity.state);
                  if (isNaN(days) || isNaN(level)) { return []; }
                  const now = Date.now();
                  return [[now, level], [now + days * 86400000, 0]];
      - type: grid
        cards:
          - type: heading
            heading: Daily consumption
            heading_style: title
            icon: mdi:chart-bar
          - type: custom:apexcharts-card
            section_mode: true
            grid_options:
              columns: full
              rows: 5
            graph_span: "14d"
            span:
              end: day
            header:
              show: true
              title: Pellets per day
              show_states: false
            yaxis:
              - min: 0
                decimals: 0
            series:
              - entity: sensor.consumption_today
                name: Pellets per day
                type: column
                color: "#c4571a"
                unit: kg
                group_by:
                  func: max
                  duration: "1d"
                show:
                  legend_value: false
      - type: grid
        cards:
          - type: heading
            heading: Service
            heading_style: title
            icon: mdi:wrench
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.ignition_count
                name: Ignitions
              - type: tile
                entity: sensor.ignition_time
                name: Ignition time
              - type: tile
                entity: sensor.motor_time
                name: Motor time
              - type: tile
                entity: sensor.electricity_time
                name: Electricity time
              - type: tile
                entity: sensor.feeder_time
                name: Feeder time
          - type: statistics-graph
            title: Runtime per day
            entities:
              - sensor.motor_time
              - sensor.ignition_time
            days_to_show: 14
            period: day
            stat_types:
              - change
            chart_type: bar
  - title: Controls
    path: pellmon-controls
    icon: mdi:tune
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Burner settings
            heading_style: title
            icon: mdi:tune
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: number.boiler_temp_setpoint
                name: Boiler setpoint
                features:
                  - type: numeric-input
                    style: slider
              - type: tile
                entity: number.boiler_temp_minimum
                name: Boiler minimum
                features:
                  - type: numeric-input
                    style: slider
              - type: tile
                entity: number.boiler_diff_down
                name: Boiler diff down
                features:
                  - type: numeric-input
                    style: slider
              - type: tile
                entity: number.boiler_diff_up
                name: Boiler diff up
                features:
                  - type: numeric-input
                    style: slider
              - type: tile
                entity: number.min_power
                name: Min power
                features:
                  - type: numeric-input
                    style: slider
              - type: tile
                entity: number.max_power
                name: Max power
                features:
                  - type: numeric-input
                    style: slider
              - type: tile
                entity: number.chimney_draught
                name: Chimney draught
                features:
                  - type: numeric-input
                    style: slider
              - type: tile
                entity: number.feeder_capacity
                name: Feeder capacity
                features:
                  - type: numeric-input
                    style: slider
              - type: tile
                entity: number.cleaning_interval
                name: Cleaning interval
                features:
                  - type: numeric-input
                    style: slider
              - type: tile
                entity: number.cleaning_time
                name: Cleaning time
                features:
                  - type: numeric-input
                    style: slider
      - type: grid
        cards:
          - type: heading
            heading: Hot water
            heading_style: title
            icon: mdi:water-boiler
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: number.hot_water_temp_setpoint
                name: Hot water setpoint
                features:
                  - type: numeric-input
                    style: slider
              - type: tile
                entity: number.hot_water_diff
                name: Hot water diff
                features:
                  - type: numeric-input
                    style: slider
      - type: grid
        cards:
          - type: heading
            heading: Fuel
            heading_style: title
            icon: mdi:grain
          - type: tile
            entity: number.silo_fill_level
            name: Silo fill level
            features:
              - type: numeric-input
                style: slider
            icon: mdi:silo
          - type: tile
            entity: number.set_magazine_content
            name: Set magazine content
            features:
              - type: numeric-input
                style: slider
            icon: mdi:grain
      - type: grid
        cards:
          - type: heading
            heading: Resets
            heading_style: title
            icon: mdi:restart
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: button.reset_alarm
                name: Reset alarm
                icon: mdi:restart
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.reset_alarm
                  confirmation:
                    text: "Reset the burner alarm?"
                icon_tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.reset_alarm
                  confirmation:
                    text: "Reset the burner alarm?"
              - type: tile
                entity: button.reset_ignition
                name: Reset ignition
                icon: mdi:restart
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.reset_ignition
                  confirmation:
                    text: "Clear the ignition counter and time?"
                icon_tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.reset_ignition
                  confirmation:
                    text: "Clear the ignition counter and time?"
